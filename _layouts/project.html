---
layout: default
---

<article class="project">
    <h1>{{ page.title }}</h1>
    
    {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    {% endif %}
    
    <div class="project-meta">
        {% if page.technologies %}
        <p><strong>Technologies:</strong> {{ page.technologies | join: ', ' }}</p>
        {% endif %}
        
        {% if page.link %}
        <p><strong>Link:</strong> <a href="{{ page.link }}" target="_blank">View Project</a></p>
        {% endif %}
        
        {% if page.github %}
        <p><strong>GitHub:</strong> <a href="{{ page.github }}" target="_blank">View Code</a></p>
        {% endif %}
    </div>
    
    <div class="project-content">
        {{ content }}
    </div>
</article>
